[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite1-rpi"
description = "Control library for the Satellite1 Raspberry Pi HAT"
readme = "README.md"
authors = [{ name = "Mischa Siekmann", email = "mischa.siekmann@futureproofhomes.net" }]
license = { file = "LICENSE" }
dynamic = ["version"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "smbus2>=0.4",
    "spidev>=3.6 ; sys_platform == 'linux'",
    "RPi.GPIO>=0.7 ; sys_platform == 'linux' and (platform_machine == 'armv7l' or platform_machine == 'aarch64')",
]

requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest", "black"]


[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["satellite1", "satellite1.*"]

[tool.setuptools_scm]
search_parent_directories = true
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
